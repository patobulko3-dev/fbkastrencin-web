[build]
  command = "npm run build"
  publish = "dist"
  # nestavať, keď sa zmenili iba dáta zo szfb.sk (web si ich ťahá priamo z GitHubu) – šetrí kredity
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data/szfb.json'"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
