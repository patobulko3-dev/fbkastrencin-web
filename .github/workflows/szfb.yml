name: Aktualizácia dát zo szfb.sk

on:
  schedule:
    # každé 2 hodiny od 7:00 do 23:00 (UTC); počas zápasových večerov častejšie
    - cron: '5 5-21/2 * * *'
    - cron: '35 17-21 * * 5,6,0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: szfb
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run scrape
      - name: Uložiť zmeny
        run: |
          if git diff --quiet -- data/szfb.json; then
            echo "Bez zmien."
            exit 0
          fi
          git config user.name "szfb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/szfb.json
          git commit -m "Aktualizácia dát zo szfb.sk"
          git push
